<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse · Airport Weather Tracker</title>
  <meta name="description" content="Search, filter and sort the latest weather at every tracked airport, and star your favourites.">
  <meta name="theme-color" content="#1c5cab">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header id="site-nav"></header>
  <main>
    <div id="offline" class="banner" hidden>You are offline. Showing the last data this device loaded.</div>
    <h1>Browse</h1>
    <p id="meta" class="muted">Loading…</p>
    <div class="controls" id="controls" hidden>
      <label>Search airports<input type="search" id="q" placeholder="Name, code, city or country"></label>
      <label>Region<select id="f-region"></select></label>
      <label>Country<select id="f-country"></select></label>
      <label>Source<select id="f-source"></select></label>
      <label class="inline"><input type="checkbox" id="f-star"> Shortlist only (<span id="star-count">0</span>)</label>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
    <p id="count" class="muted small" aria-live="polite"></p>
    <div id="content"></div>
  </main>
  <script src="assets/common.js"></script>
  <script src="assets/browse.js"></script>
</body>
</html>
